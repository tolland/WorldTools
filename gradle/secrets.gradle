ext.loadPropertiesFile = { String path ->
    def f = rootProject.file(path)
    if (!f.exists()) return null

    def p = new Properties()
    f.withInputStream { p.load(it) }
    p
}

ext._localSecrets = null

ext.getSecret = { String envName,
                  String gradleProp = null,
                  String fileName = ".local-secrets.properties" ->

    def value =
            System.getenv(envName)
                    ?: (gradleProp ? project.findProperty(gradleProp) : null)
                    ?: (
                    _localSecrets
                            ?: (_localSecrets = loadPropertiesFile(fileName))
            )?.getProperty(envName)

    if (value == null) {
        throw new GradleException("Missing secret '$envName'")
    }

    value
}

ext.mcUsername =
        System.getenv("MQTTBOT_USERNAME")
                ?: project.findProperty("bot_username")
